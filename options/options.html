<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Control - Настройка микрофона</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      text-align: center;
      color: #333;
    }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { color: #666; line-height: 1.6; }
    button {
      background: #007AFF;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #0051d5; }
    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>🎤 Настройка микрофона</h1>
  <p>
    Chrome требует разрешение на микрофон один раз с этой страницы.<br>
    После этого расширение сможет слушать голос без повторных запросов.
  </p>
  <button id="grantBtn">Разрешить доступ к микрофону</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
